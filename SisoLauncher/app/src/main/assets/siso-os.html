<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<title>SISO OS – bản xem thử</title>
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1424">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#14202e;--mut:#5b6b7e;--glass:rgba(250,252,255,.78);--card:rgba(255,255,255,.65);--line:rgba(20,32,46,.13);--acc:#38a3ff;--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e8eef7;--mut:#93a3b8;--glass:rgba(20,28,44,.76);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--fg:#e8eef7;--mut:#93a3b8;--glass:rgba(20,28,44,.76);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b1424;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--fg);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#os{position:relative;height:100%;overflow:hidden;background:var(--wp)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line)}
#icons{position:absolute;left:12px;top:12px;display:grid;gap:6px}
.ic{width:80px;background:none;border:0;display:grid;justify-items:center;gap:4px;padding:6px;border-radius:var(--r);color:#fff;text-shadow:0 1px 4px #000a;font-size:12px}
.ic:hover{background:rgba(255,255,255,.12)}
.tile{width:40px;height:40px;border-radius:calc(var(--r) - 2px);display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;text-shadow:none;background:linear-gradient(135deg,var(--acc),#6d5cff)}
#tb{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);height:52px;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:calc(var(--r) + 6px);z-index:9000;max-width:calc(100% - 16px)}
.tb-top #tb{bottom:auto;top:8px}
.tbb{position:relative;width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;flex:none}
.tbb:hover{background:var(--card)}
.tbb .tile{width:30px;height:30px;font-size:11px}
.tbb.run::after{content:"";position:absolute;bottom:1px;width:14px;height:3px;border-radius:3px;background:var(--mut)}
.tbb.on::after{background:var(--acc);width:20px}
#tray{margin-left:8px;padding-left:10px;border-left:1px solid var(--line);text-align:right;font-size:12px;line-height:1.25;white-space:nowrap}
#tray small{color:var(--mut);display:block}
#start{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);width:min(440px,calc(100% - 16px));padding:16px;border-radius:calc(var(--r) + 8px);z-index:9001;display:none}
.tb-top #start{bottom:auto;top:68px}
#start.open{display:block}
#start h3{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.app{background:none;border:0;display:grid;justify-items:center;gap:5px;padding:10px 4px;border-radius:var(--r);font-size:12px;text-align:center}
.app:hover{background:var(--card)}
.sfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:calc(var(--r) - 3px);padding:6px 12px}
.btn:hover{border-color:var(--acc)}
.btn.sel{background:var(--acc);border-color:var(--acc);color:#fff}
.win{position:absolute;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.win.hide{display:none}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 68px)!important;border-radius:0}
.tb-top .win.max{top:68px!important}
.win header{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;font-weight:600}
.win header span{display:flex;gap:2px}
.win header button{width:30px;height:26px;border:0;background:none;border-radius:6px}
.win header button:hover{background:var(--card)}
.win header button[data-a=x]:hover{background:#e5484d;color:#fff}
.body{flex:1;overflow:auto;padding:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--card);margin-bottom:8px}
.row .grow{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;color:#111}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .8s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:12px}
.card b{font-size:20px}
.flex4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px}
.mode.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.mode small{color:var(--mut);display:block;margin-top:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.sel{border-color:var(--fg)}
.set{margin-bottom:16px}.set>p{margin:0 0 8px;font-weight:600}.set>div{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
pre{margin:0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.term{background:#0d121b;color:#d7e3f4;height:100%;border-radius:calc(var(--r) - 4px);padding:10px;overflow:auto}
.term input{background:none;border:0;color:inherit;font:inherit;width:70%;outline:0}
#toast{position:absolute;right:12px;top:12px;display:grid;gap:8px;z-index:9500;width:min(320px,calc(100% - 24px))}
.t{padding:10px 14px;border-radius:var(--r);animation:pop .2s ease-out;font-size:13px}
#boot{position:absolute;inset:0;z-index:99999;background:linear-gradient(180deg,#f7f9fb,#e3ebf2);display:grid;place-content:center;justify-items:center;gap:22px;color:#14202e;transition:opacity .8s,transform .8s,filter .8s}
#boot.gone{opacity:0;transform:scale(1.08);filter:blur(8px);pointer-events:none}
#boot .tile{width:84px;height:84px;font-size:30px;border-radius:24px}
#boot .pb{width:160px;height:4px;background:#1a3a5c22;border-radius:4px;overflow:hidden}
#boot .pb i{display:block;height:100%;width:0;background:var(--acc);animation:ld 3.4s cubic-bezier(.5,.1,.3,1) .4s forwards}
@keyframes ld{to{width:100%}}
#icons{grid-auto-flow:column;grid-template-rows:repeat(auto-fill,86px);height:calc(100% - 90px);align-content:start}
#qp{position:absolute;right:12px;bottom:68px;width:min(320px,calc(100% - 24px));padding:14px;border-radius:calc(var(--r) + 8px);z-index:9001;display:none;max-height:calc(100% - 90px);overflow:auto}
.tb-top #qp{bottom:auto;top:68px}#qp.open{display:block}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.qt{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px;text-align:left}
.qt.on{background:var(--acc);border-color:var(--acc);color:#fff}.qt small{display:block;opacity:.75}
#qp label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0}#qp input[type=range]{flex:1}
#ctx{position:absolute;z-index:9600;min-width:190px;padding:6px;border-radius:var(--r);display:none}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}#ctx button:hover{background:var(--card)}
.dlg{position:absolute;inset:0;z-index:9700;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:12px}
.dlg>div{width:min(400px,100%);padding:18px;border-radius:calc(var(--r) + 6px)}
.fm{display:grid;grid-template-columns:150px 1fr;gap:12px}.fm nav{display:grid;align-content:start;gap:4px}
.fm nav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px}.fm nav button.sel{background:var(--card);box-shadow:0 0 0 1px var(--acc) inset}
textarea.np{width:100%;height:100%;min-height:240px;resize:none;border:0;background:var(--card);color:inherit;border-radius:var(--r);padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace}
#dim{position:absolute;inset:0;z-index:99998;background:#000;opacity:var(--dim,0);pointer-events:none}
@media(max-width:560px){.fm{grid-template-columns:1fr}.fm nav{grid-template-columns:1fr 1fr}}
:root[data-theme="light"]{--glass:rgba(238,246,255,.62);--card:rgba(255,255,255,.52);--line:rgba(30,70,120,.14)}
.glass{backdrop-filter:blur(32px) saturate(1.9);-webkit-backdrop-filter:blur(32px) saturate(1.9)}
#tb{left:0;right:0;bottom:0;transform:none;max-width:none;height:48px;border-radius:0;border-width:1px 0 0;justify-content:center;padding:4px 12px}
.tb-top #tb{top:0;bottom:auto;border-width:0 0 1px}
#tray{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;gap:10px;border:0;margin:0;padding:0;font-size:11px;line-height:1.25}
#tray .chip{padding:3px 8px;border-radius:99px;background:var(--card);color:var(--fg)}
#wb{position:absolute;left:12px;top:0;bottom:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:0 8px;border-radius:8px;font-size:12px;text-align:left}
#wb:hover{background:var(--card)}#wb small{display:block;color:var(--mut)}
.srch{height:34px;min-width:150px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 14px;text-align:left;color:var(--mut);margin:0 4px;flex:none}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:20px}.wl i{height:9px;background:var(--acc);border-radius:2px}
#start{bottom:56px;width:min(560px,calc(100% - 16px));padding:20px 24px;border-radius:12px}.tb-top #start{top:56px}
#start .grid{grid-template-columns:repeat(6,1fr)}
#ss{border-radius:99px;width:100%;margin-bottom:14px;padding:9px 16px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rec button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:8px}.rec button:hover{background:var(--card)}
.rec .tile{width:30px;height:30px;font-size:10px;flex:none}.rec small{display:block;color:var(--mut)}
.sfoot{margin:16px -24px -20px;padding:12px 24px;background:rgba(0,0,0,.06)}
.usr{display:flex;align-items:center;gap:10px}
#qp{bottom:56px}.tb-top #qp{top:56px}
#wg{position:absolute;left:12px;bottom:56px;width:min(320px,calc(100% - 24px));padding:14px;border-radius:12px;z-index:9001;display:none;max-height:calc(100% - 90px);overflow:auto}
.tb-top #wg{bottom:auto;top:56px}#wg.open{display:block}
.win.max{height:calc(100% - 48px)!important}.tb-top .win.max{top:48px!important}
.crumb{padding:8px 12px;margin-bottom:10px;border-radius:8px}
@media(max-width:640px){#tb{justify-content:flex-start;overflow-x:auto}#tray{position:static;margin-left:auto}#wb,#tray .chip,.srch{display:none}#start .grid{grid-template-columns:repeat(4,1fr)}.rec{grid-template-columns:1fr}}

:root[data-theme="light"]{--glass:rgba(244,249,255,.52);--card:rgba(255,255,255,.45);--line:rgba(255,255,255,.65);--gsh:0 10px 36px rgba(20,50,90,.20),inset 0 1px 0 rgba(255,255,255,.80)}
.glass{backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);background-image:var(--gsheen);box-shadow:var(--gsh)}
.noblur .glass{background-image:none}
#tb{left:10px;right:10px;bottom:8px;height:56px;border-radius:28px;border-width:1px;padding:6px 14px;background-image:var(--gsheen);box-shadow:var(--gsh)}
.tb-top #tb{top:8px;bottom:auto;border-width:1px}
.win.max{height:calc(100% - 78px)!important;border-radius:24px}
.win{border-radius:24px;overflow:hidden}
#start,#qp,#wg{border-radius:28px}
.dlg>div{border-radius:26px}
#ctx{border-radius:18px;padding:6px}#ctx button{border-radius:12px}
.tbb{border-radius:16px}.tbb .tile{border-radius:10px}
.tile{border-radius:14px}
.ic{border-radius:18px}
.card,.mode,.qt,.t,.np,.app{border-radius:18px}
.row{border-radius:16px}
.btn{border-radius:14px}
.srch,#ss{border-radius:99px}
#tray .chip{border-radius:99px;border:1px solid var(--line)}
#hud{border-radius:16px}
#toast{bottom:76px}.tb-top #toast{bottom:12px}
</style>

games(b){b.innerHTML=`<p style="margin:0 0 10px;color:var(--mut)">Thư viện gộp từ Steam, Epic, GOG. Mức tương thích theo thang ProtonDB. Dữ liệu mẫu.</p>`+GAMES.map((g,i)=>`<div class="row">${cov(i)}<div class="grow"><b>${g[0]}</b><small>${g[1]}${g[2]=='Unsupported'?' · anti-cheat không hỗ trợ':''}</small></div><span class="badge" style="background:${TIER[g[2]]}">${g[2]}</span><button class="btn" data-g="${i}">${g[2]=='Unsupported'?'Chi tiết':'Chơi'}</button></div>`).join('');
 b.onclick=e=>{const i=e.target.dataset.g;if(i==null)return;const g=GAMES[i];
  if(g[2]=='Unsupported')return toast('Game dùng anti-cheat mà nhà phát hành chưa cho chạy trên Linux. SISO không thể vượt hạn chế này.',1);
  toast(`Đang mở ${g[0]} qua Proton. Đã bật chế độ Hiệu năng.`);if(!restore)restore=st.mode;setMode('Hiệu năng');
  clearTimeout(UI.gt);UI.gt=setTimeout(()=>{toast(`${g[0]} đã đóng. Trở về chế độ ${restore}.`);setMode(restore);restore=null},9000)}},

head:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/>',
mouse:'<rect x="6.5" y="3.5" width="11" height="17" rx="5.5"/><path d="M12 3.5v6"/>',
pad:'<path d="M7 9h10a4 4 0 0 1 4 4v1.5a2.5 2.5 0 0 1-4.3 1.7L15 14H9l-1.7 2.2A2.5 2.5 0 0 1 3 14.5V13a4 4 0 0 1 4-4z"/><path d="M8 11v3M6.5 12.5h3"/><circle cx="15.5" cy="12" r=".9" fill="currentColor"/><circle cx="17.5" cy="13.7" r=".9" fill="currentColor"/>',
usb:'<rect x="8" y="9" width="8" height="11" rx="1.5"/><path d="M10 9V4h4v5M11 6.5h.01M13 6.5h.01"/>',
key:'<rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 11h.01M11 11h.01M15 11h.01M8 15h8"/>',
mon:'<rect x="3.5" y="5" width="17" height="11" rx="2"/><path d="M9 20h6M12 16v4"/>',
spk:'<rect x="6.5" y="3.5" width="11" height="17" rx="3"/><circle cx="12" cy="14.5" r="3"/><circle cx="12" cy="8" r=".8" fill="currentColor"/>',
mic:'<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>',
trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'};
const ic=(n,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle">${IP[n]}</svg>`;
const volN=()=>(Q.mute||+Q.vol==0)?'mute':+Q.vol<40?'vlow':'vol';
let qpm='quick';
const D=[{n:'Tai nghe Bluetooth',i:'head',bt:1,on:0,out:1,bat:76,d:'Âm thanh'},{n:'Chuột không dây',i:'mouse',bt:1,on:1,bat:62,d:'Chuột'},{n:'Tay cầm Xbox',i:'pad',bt:1,on:0,bat:88,d:'Tay cầm'},{n:'USB 32 GB (E:)',i:'usb',usb:1,on:1,d:'Ổ đĩa USB'},{n:'Bàn phím cơ',i:'key',usb:1,on:1,d:'Bàn phím'},{n:'Màn hình 2',i:'mon',mon:1,d:'Màn hình (HDMI)'}];
const dOn=d=>d.mon?!!M.on:!!d.on,usbOn=()=>{const d=D.find(x=>x.usb&&x.n.startsWith('USB'));return !!(d&&d.on)};
function devOn(){return D.filter(dOn).length}
function outs(){const o=['Loa trong (SISO-PC)'];D.forEach(d=>{if(d.out&&dOn(d))o.push(d.n)});if(M.on)o.push('HDMI: Màn hình 2');if(!o.includes(Q.out))Q.out=o[0];return o}
function trIcons(){const v=$('[data-tr="vol"]');if(v)v.innerHTML=ic(volN());const n=$('.dd');n&&(n.textContent=devOn())}
function openQp(m){const q=$('#qp');if(q.classList.contains('open')&&qpm==m)q.classList.remove('open');else{qp(m);q.classList.add('open')}}
function plugMon(on){M.on=on?1:0;if(on){M.mode='ext';placeM2()}else{M.sel=0;M.mode='one'}applyM();wins.disp&&UI.disp(wins.disp.querySelector('.body'))}
const H3='<h3 style="margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:500">',P='<p style="margin:12px 0 6px;font-weight:600">';
function qpVol(){const o=outs(),v=+Q.vol,m=Q.mute||!v?0:v;$('#qp').innerHTML=`${H3}Âm thanh</h3><div class="row" style="margin-bottom:10px"><button class="btn" data-mute aria-label="Tắt tiếng">${ic(m?'vol':'mute')}</button><input type="range" id="vol2" min="0" max="100" value="${m}" style="flex:1" aria-label="Âm lượng"><b id="vv" style="min-width:40px;text-align:right">${m}%</b></div>${P}Thiết bị đầu ra</p>${o.map(n=>`<button class="row" data-out="${n}" style="width:100%;border:1px solid ${n==Q.out?'var(--acc)':'transparent'};text-align:left"><span class="grow">${n}</span>${n==Q.out?'<span>✓</span>':''}</button>`).join('')}${P}Micro</p><div class="row"><span>${ic('mic')}</span><input type="range" id="mic" min="0" max="100" value="${Q.mic}" style="flex:1" aria-label="Micro"><b id="mv" style="min-width:40px;text-align:right">${Q.mic}%</b></div>${P}Âm lượng theo ứng dụng</p>${['Game','Hệ thống'].map((n,i)=>`<div class="row"><span style="width:70px">${n}</span><input type="range" data-av="${i}" min="0" max="100" value="${Q.av[i]}" style="flex:1" aria-label="Âm lượng ${n}"></div>`).join('')}`}
function volClick(e){if(e.target.closest('[data-mute]')){Q.mute=!Q.mute;qpVol();trIcons();return}const o=e.target.closest('[data-out]');if(o){Q.out=o.dataset.out;toast('Đã chuyển âm thanh sang '+Q.out+'.');qpVol()}}
function volInput(e){const t=e.target;if(t.id=='vol2'){Q.vol=+t.value;Q.mute=0;$('#vv').textContent=Q.vol+'%';trIcons()}else if(t.id=='mic'){Q.mic=+t.value;$('#mv').textContent=Q.mic+'%'}else if(t.dataset.av!=null)Q.av[+t.dataset.av]=+t.value}
function qpDev(){$('#qp').innerHTML=`${H3}Thiết bị kết nối</h3><label class="row" style="cursor:pointer"><span class="grow">Bluetooth<small>${Q.bt?'Đang bật':'Đang tắt'}</small></span><input type="checkbox" data-bt ${Q.bt?'checked':''}></label>${D.map((d,i)=>{const on=dOn(d),dis=d.bt&&!Q.bt&&!on;return `<div class="row"><span>${ic(d.i,22)}</span><div class="grow"><b>${d.n}</b><small>${d.d} · ${on?'Đã kết nối'+(d.bat?' · Pin '+d.bat+'%':''):'Chưa kết nối'}</small></div><button class="btn" data-dv="${i}" ${dis?'disabled':''}>${on?(d.usb?'Rút an toàn':'Ngắt'):'Kết nối'}</button></div>`}).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" data-scan>Tìm thiết bị Bluetooth</button><button class="btn" data-go="drv">Driver</button><button class="btn" data-go="disp">Màn hình</button></div>`}
function devClick(e){const t=e.target.closest('[data-dv],[data-scan],[data-go]');if(!t)return;
 if(t.dataset.go){open(t.dataset.go);return}
 if(t.dataset.scan!=null){if(!Q.bt)return toast('Hãy bật Bluetooth trước.',1);t.textContent='Đang quét…';setTimeout(()=>{if(!D.some(d=>d.n=='Loa Bluetooth')){D.push({n:'Loa Bluetooth',i:'spk',bt:1,on:0,out:1,bat:54,d:'Âm thanh'});toast('Tìm thấy: Loa Bluetooth')}else toast('Không tìm thấy thiết bị mới.');if(qpm=='dev')qpDev()},1400);return}
 const d=D[+t.dataset.dv],on=dOn(d);
 if(d.mon){plugMon(!on);toast(on?'Đã rút Màn hình 2.':'Đã phát hiện Màn hình 2.')}
 else{d.on=on?0:1;toast((on?(d.usb?'Đã rút an toàn ':'Đã ngắt '):'Đã kết nối ')+d.n+'.');if(d.out&&d.on){Q.out=d.n;toast('Âm thanh đã chuyển sang '+d.n+'.')}if(d.n.startsWith('Tay cầm')&&d.on)toast('Đã gán nút sẵn cho Game Center.')}
 qpDev();trIcons();wins.pc&&UI.pc(wins.pc.querySelector('.body'))}
$('#qp').onchange=e=>{if(qpm=='dev'&&e.target.dataset.bt!=null){Q.bt=e.target.checked?1:0;if(!Q.bt)D.forEach(d=>{if(d.bt)d.on=0});qpDev();trIcons()}};
setWp(0);load();applyLay();drawIcons();renderBar();$("#boot").classList.add("gone");os.classList.add("wake");
</script>
</body>
</html>
